[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adcs-words-cpp-extractor"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent Aspose.Words C++ extraction worker"
dependencies = []

[project.scripts]
adcs-words-cpp-extract = "adcs_words_cpp.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
